---
# Unit tests – Vitest project `unit`:
#   src/(utils|services)/**.spec.ts  and  **.unit.spec.ts
name: unit tests
discover: find src -type f \( -name "*.unit.spec.ts" -o \( -path "*/utils/*" -name "*.spec.ts" \) -o \( -path "*/services/*" -name "*.spec.ts" \) \)
run: VITEST_JUNIT_OUTPUT_FILE="<< outputs.junit >>" ./scripts/run-vitest.sh unit << test.atoms >>
outputs:
  junit: test-reports/unit/results.xml

---
# Component rendering tests – Vitest project `component`:
#   **.spec.tsx
name: component tests
discover: find src -type f -name "*.spec.tsx"
run: VITEST_JUNIT_OUTPUT_FILE="<< outputs.junit >>" ./scripts/run-vitest.sh component << test.atoms >>
outputs:
  junit: test-reports/component/results.xml
